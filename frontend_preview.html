<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClauseNet - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; transition: background-color 0.5s ease, color 0.5s ease; }
        .dark body { background-color: #0a0a0b; color: #f3f4f6; }
        body { background-color: #f8fafc; color: #1e293b; }
        
        .font-outfit { font-family: 'Outfit', sans-serif; }
        
        /* Glass Panel */
        .glass-panel { transition: all 0.5s ease; backdrop-filter: blur(20px); border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .dark .glass-panel { background: rgba(19, 19, 22, 0.6); border: 1px solid rgba(39, 39, 42, 0.5); }
        .glass-panel { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(226, 232, 240, 0.8); }
        
        .text-gradient { background: linear-gradient(to right, #818cf8, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Dynamic Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            33% { transform: translate(50px, -50px) scale(1.2) rotate(10deg); }
            66% { transform: translate(-30px, 30px) scale(0.8) rotate(-10deg); }
            100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animate-blob { animation: blob 10s infinite alternate; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; }
        
        /* Input area styling */
        textarea { transition: color 0.3s ease; }
        .dark textarea { color: white; }
        textarea { color: #0f172a; }
        
        .dark .header-bg { background: rgba(10, 10, 11, 0.4); }
        .header-bg { background: rgba(255, 255, 255, 0.4); }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 900: '#312e81' },
                        dark: { panel: '#131316', border: '#27272a' }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = Motion;

        // Native SVG Bar Chart — no external dep needed
        const NativeBarChart = ({ data, isDark }) => {
            const max = Math.max(...data.map(d => d.value), 1);
            const barH = 28;
            const gap = 14;
            const labelW = 140;
            const chartW = 320;
            const totalH = data.length * (barH + gap);
            return (
                <svg width="100%" viewBox={`0 0 ${labelW + chartW + 50} ${totalH}`} style={{overflow:'visible'}}>
                    {data.map((d, i) => {
                        const y = i * (barH + gap);
                        const barW = (d.value / max) * chartW;
                        const fill = i === 0 ? '#6366f1' : (isDark ? '#3f3f46' : '#cbd5e1');
                        return (
                            <g key={d.name}>
                                <text x={labelW - 8} y={y + barH / 2 + 5} textAnchor="end"
                                    fill={isDark ? '#9ca3af' : '#64748b'} fontSize="12">{d.name}</text>
                                <rect x={labelW} y={y} width={barW} height={barH} rx="4" fill={fill} />
                                <text x={labelW + barW + 6} y={y + barH / 2 + 5}
                                    fill={isDark ? '#e4e4e7' : '#334155'} fontSize="12">{d.value}%</text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // Custom SVG Icons to avoid CDN issues
        const Icons = {
            Scale: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            BarChart: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Moon: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Send: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Loader: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
        };

        const App = () => {
            const [text, setText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [history, setHistory] = useState([]);
            const [isDark, setIsDark] = useState(true);

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);

            const handleAnalyze = async () => {
                if (!text.trim()) return;
                setIsLoading(true);
                setResult(null);

                try {
                    // Artificial delay for premium feel
                    await new Promise(resolve => setTimeout(resolve, 800));
                    
                    const response = await fetch('http://localhost:8000/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });
                    
                    if (!response.ok) throw new Error('Backend failed');
                    
                    const data = await response.json();
                    
                    // Transform probabilities for Recharts
                    const probArray = Object.entries(data.probabilities)
                        .slice(0, 4)
                        .map(([name, value]) => ({ name, value: Math.round(value * 100) }));
                        
                    const actualResult = {
                        class_name: data.class_name,
                        confidence: data.confidence,
                        probabilities: probArray
                    };
                    
                    setResult(actualResult);
                    setHistory([{ id: Date.now(), text, result: actualResult, time: new Date().toLocaleTimeString() }, ...history]);
                } catch (error) {
                    console.log('Backend not reachable, using mock data.');
                    const mockResult = {
                        class_name: "Governing Law",
                        confidence: 0.945,
                        probabilities: [
                            { name: "Governing Law", value: 94.5 },
                            { name: "Dispute Resolution", value: 3.5 },
                            { name: "Termination", value: 1.2 },
                            { name: "Confidentiality", value: 0.5 },
                        ]
                    };
                    setResult(mockResult);
                    setHistory([{ id: Date.now(), text, result: mockResult, time: new Date().toLocaleTimeString() }, ...history]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex h-screen overflow-hidden relative transition-colors duration-500">
                    {/* Dynamic Backgrounds */}
                    <div className="absolute top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
                        {isDark ? (
                            <>
                                <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-900/30 blur-[120px] animate-blob mix-blend-screen" />
                                <div className="absolute bottom-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-purple-900/30 blur-[120px] animate-blob animation-delay-2000 mix-blend-screen" />
                                <div className="absolute top-[30%] left-[30%] w-[30%] h-[30%] rounded-full bg-pink-900/20 blur-[100px] animate-blob animation-delay-4000 mix-blend-screen" />
                            </>
                        ) : (
                            <>
                                <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-300/40 blur-[100px] animate-blob mix-blend-multiply" />
                                <div className="absolute bottom-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-purple-300/40 blur-[100px] animate-blob animation-delay-2000 mix-blend-multiply" />
                                <div className="absolute top-[30%] left-[30%] w-[30%] h-[30%] rounded-full bg-pink-200/40 blur-[100px] animate-blob animation-delay-4000 mix-blend-multiply" />
                            </>
                        )}
                    </div>

                    {/* Sidebar */}
                    <div className="w-80 h-full border-r border-slate-200 dark:border-white/5 bg-white/40 dark:bg-black/40 backdrop-blur-xl hidden lg:flex flex-col p-6 z-10 transition-colors duration-500">
                        <div className="flex items-center justify-between mb-8">
                            <div className="flex items-center gap-3 text-indigo-500 dark:text-indigo-400">
                                <Icons.History />
                                <h2 className="font-semibold text-lg font-outfit text-slate-800 dark:text-white">History</h2>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2">
                            {history.length === 0 ? (
                                <div className="text-slate-400 dark:text-gray-500 text-sm text-center mt-20">No recent analyzes</div>
                            ) : history.map(item => (
                                <motion.div 
                                    initial={{ opacity: 0, x: -20 }}
                                    animate={{ opacity: 1, x: 0 }}
                                    key={item.id} 
                                    className="p-4 rounded-xl bg-white dark:bg-white/5 border border-slate-100 dark:border-white/5 shadow-sm dark:shadow-none hover:border-indigo-200 dark:hover:border-white/10 transition-all cursor-pointer"
                                >
                                    <div className="text-xs text-indigo-500 dark:text-indigo-400 font-medium mb-1">{item.result.class_name}</div>
                                    <p className="text-sm text-slate-600 dark:text-gray-300 line-clamp-2">{item.text}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full overflow-y-auto custom-scrollbar relative z-10">
                        <header className="px-8 py-6 flex items-center justify-between sticky top-0 z-50 header-bg backdrop-blur-md border-b border-slate-200 dark:border-white/5 transition-colors duration-500">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg shadow-lg">
                                    <span className="text-white"><Icons.Scale /></span>
                                </div>
                                <h1 className="text-2xl font-bold font-outfit text-slate-900 dark:text-white">Clause<span className="text-gradient">Net</span></h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setIsDark(!isDark)}
                                    className="p-2 rounded-full border border-slate-200 dark:border-white/10 bg-white/50 dark:bg-white/5 text-slate-600 dark:text-gray-300 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors"
                                >
                                    {isDark ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                                <div className="px-4 py-1.5 rounded-full border border-emerald-500/20 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-medium flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Live Model Active
                                </div>
                            </div>
                        </header>

                        <div className="max-w-4xl mx-auto w-full px-6 py-12">
                            <div className="text-center mb-12">
                                <h2 className="text-4xl md:text-5xl font-bold font-outfit mb-6 text-slate-900 dark:text-white">Classify clauses with <br/> superhuman precision</h2>
                                <p className="text-slate-600 dark:text-gray-400 text-lg">Paste your legal text below for instant AI categorization.</p>
                            </div>

                            {/* Input Panel */}
                            <div className="glass-panel p-6 mb-8 relative group">
                                <div className="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur opacity-10 group-focus-within:opacity-30 transition duration-500"></div>
                                <div className="relative">
                                    <textarea 
                                        className="w-full h-40 bg-transparent text-lg font-outfit outline-none resize-none placeholder:text-slate-400 dark:placeholder:text-gray-600"
                                        placeholder="Paste your legal clause here..."
                                        value={text}
                                        onChange={(e) => setText(e.target.value)}
                                    ></textarea>
                                    <div className="flex justify-between items-center mt-4 border-t border-slate-200 dark:border-white/5 pt-4">
                                        <div className="text-xs text-slate-500 dark:text-gray-500">{text.length} characters</div>
                                        <button 
                                            onClick={handleAnalyze}
                                            disabled={isLoading || !text.trim()}
                                            className="px-8 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-lg shadow-indigo-500/20 transition-all active:scale-95 disabled:opacity-50 flex items-center gap-2"
                                        >
                                            {isLoading ? <Icons.Loader /> : "Analyze"}
                                            {!isLoading && <Icons.Send />}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Results */}
                            <AnimatePresence>
                            {result && (
                                <motion.div 
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -20 }}
                                    className="grid grid-cols-1 md:grid-cols-3 gap-6"
                                >
                                    <div className="md:col-span-1 glass-panel p-6">
                                        <h3 className="text-slate-500 dark:text-gray-400 text-sm mb-4">Top Prediction</h3>
                                        <div className="text-3xl font-bold text-gradient font-outfit mb-6">{result.class_name}</div>
                                        <div className="space-y-2">
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-500 dark:text-gray-400">Confidence</span>
                                                <span className="text-slate-900 dark:text-white font-semibold">{result.confidence * 100}%</span>
                                            </div>
                                            <div className="h-2 w-full bg-slate-200 dark:bg-white/5 rounded-full overflow-hidden">
                                                <motion.div 
                                                    initial={{ width: 0 }}
                                                    animate={{ width: `${result.confidence * 100}%` }}
                                                    transition={{ duration: 1, delay: 0.2 }}
                                                    className="h-full bg-indigo-500"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="md:col-span-2 glass-panel p-6 min-h-[300px]">
                                        <h3 className="text-slate-500 dark:text-gray-400 text-sm mb-6 flex items-center gap-2">
                                            <span className="text-indigo-500"><Icons.BarChart /></span>
                                            Probability Distribution
                                        </h3>
                                        <div className="w-full overflow-x-auto">
                                            <NativeBarChart data={result.probabilities} isDark={isDark} />
                                        </div>
                                    </div>
                                </motion.div>
                            )}
                            </AnimatePresence>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
